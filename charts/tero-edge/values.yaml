nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/usetero/edge
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Set a tag ("1.29.4") or a digest ("@sha256:...").
  tag: ""
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    # Allow CPU bursts; set a CPU limit explicitly if required by your cluster.
    memory: 128Mi

nodeSelector: {}
tolerations:
  - operator: Exists
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

service:
  enabled: false
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false

daemonset:
  updateStrategy:
    type: RollingUpdate

container:
  port: 8080
  hostPort:
    enabled: true
    port: 8080
  args:
    - /etc/tero/config.json
  livenessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5

tero:
  # Control plane base URL used to build the HTTP policy provider endpoint.
  # Example: https://control-plane.example.com
  url: ""
  # Provide inline API key (chart will create a secret) OR use existingSecret below.
  apiKey: ""
  existingSecret:
    name: ""
    key: api-key

config:
  listenAddress: "0.0.0.0"
  listenPort: 8080
  upstreamUrl: "https://agent-http-intake.logs.datadoghq.com"
  metricsUrl: "https://api.datadoghq.com"
  logLevel: "info"
  maxBodySize: 1048576

  # Process-wide inbound connection cap. Also settable via the
  # TERO_MAX_CONNECTIONS env override.
  maxConnections: 256
  # HTTP allocations, including queued bodies and transforms; leave headroom
  # for policies, native codecs, TLS, stacks and the rest of the process.
  maxBufferedBytes: 67108864
  # A retry can duplicate log lines when the first acknowledgement is lost.
  retryLogIntake: true
  upstreamTimeoutMs: 5000

  # Optional. Post-decompression body ceiling; defaults to maxBodySize when
  # null. Raise to admit payloads that decompress larger than the raw cap.
  maxDecodedBytes: null

  # Optional httpz tuning (null = built-in defaults). workerCount is event-loop
  # workers (default 1); threadPoolCount is request-handler threads (default
  # 32 per event-loop worker). Codec scratch is allocated only when needed.
  workerCount: null
  threadPoolCount: null

  # Service identity sent to the control plane on policy sync. name, namespace,
  # and version scope/match policies to this service; set them in production.
  # resourceAttributes and labels are optional extra metadata. Empty fields are
  # omitted (the binary falls back to its defaults).
  service:
    name: ""
    namespace: ""
    version: ""
    # resourceAttributes:
    #   - key: deployment.environment
    #     value: production
    resourceAttributes: []
    # labels:
    #   - key: team
    #     value: platform
    labels: []

  fileProvider:
    enabled: true
    id: file
    path: /etc/tero/policies.json

  # Optional additional providers appended to policy_providers as raw JSON objects.
  extraPolicyProviders: []

# Rendered into /etc/tero/policies.json for the file provider.
# Each list item must be a valid JSON object string (not YAML object).
policiesJSON: []
# Example:
# policiesJSON:
#   - |
#     {
#       "id": "drop-debug-logs",
#       "name": "drop-debug-logs",
#       "enabled": true,
#       "log": {
#         "match": [{ "log_field": "severity_text", "regex": "DEBUG" }],
#         "keep": "none"
#       }
#     }
