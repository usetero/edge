nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/usetero/edge
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Set a tag ("1.29.4") or a digest ("@sha256:...").
  tag: ""
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    # Handler workspace is allocated on demand and then retained, so a pod
    # under sustained load holds far more than it does at startup.
    memory: 256Mi
  limits:
    cpu: 200m
    # Sized for the default threadPoolCount of 128 at the maxBodySize below:
    # ~540 MiB of retained per-thread workspace once every handler has seen
    # compressed traffic. See the sizing formula under proxy.maxConnections.
    # Set proxy.threadPoolCount lower to trade throughput for a smaller
    # footprint: 32 threads need about 140 MiB.
    memory: 768Mi

nodeSelector: {}
tolerations:
  - operator: Exists
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

service:
  enabled: false
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false

daemonset:
  updateStrategy:
    type: RollingUpdate

container:
  port: 8080
  hostPort:
    enabled: true
    port: 8080
  args:
    - /etc/tero/config.json
  livenessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5

tero:
  # Control plane base URL used to build the HTTP policy provider endpoint.
  # Example: https://control-plane.example.com
  url: ""
  # Provide inline API key (chart will create a secret) OR use existingSecret below.
  apiKey: ""
  existingSecret:
    name: ""
    key: api-key

config:
  listenAddress: "0.0.0.0"
  listenPort: 8080
  upstreamUrl: "https://agent-http-intake.logs.datadoghq.com"
  metricsUrl: "https://api.datadoghq.com"
  logLevel: "info"
  # Raw (compressed) body cap as received on the wire.
  maxBodySize: 1572864

  # Max concurrent connections. When every slot is held the server stops
  # accepting: pending connections queue in the kernel backlog and are then
  # dropped, so senders time out while edge stays near-idle on CPU and memory.
  # Alert on rate(httpz_connections[5m]) == 0 while rate(httpz_requests[5m])
  # is above 0: existing keepalive connections still serve while new ones are
  # refused, so the accept counter flattens as the request counter climbs.
  #
  # A connection costs 20 KiB (the receive buffer), NOT maxBodySize. Sizing:
  #
  #   memory ~= maxConnections x 20 KiB
  #           + threadPoolCount x (2 x maxBodySize + 1.2 MiB)
  #
  # The second term is the per-handler workspace: the zstd window, record
  # scratch and encoder, plus a resident body buffer and a streaming pump.
  # It is allocated on demand and then retained for the life of the thread,
  # so memory tracks the number of threads that have served a compressed
  # body, not the number in flight now. Worked example at maxBodySize 2 MiB:
  #
  #   maxConnections | threadPoolCount | approx memory | suggested request
  #   ---------------|-----------------|---------------|------------------
  #   256            | 8               | 46 MiB        | 64Mi
  #   256 (default)  | 128 (default)   | 666 MiB       | 256Mi
  #   2048           | 16              | 123 MiB       | 192Mi
  #   4096           | 32              | 246 MiB       | 320Mi
  #
  # threadPoolCount is the dominant term. Lower it before you raise the
  # memory limit if throughput allows: it is the only knob that bounds
  # retained workspace. At this chart's own maxBodySize of 1.5 MiB the
  # default 256/128 shape works out at about 540 MiB, which is what the
  # resources block above is sized for.
  #
  # Raise maxConnections and threadPoolCount together: connections admitted
  # beyond what the handler pool can serve just queue until requestTimeout.
  # Also settable via the TERO_MAX_CONNECTIONS env override.
  maxConnections: 256

  # Optional. Post-decompression body ceiling; null uses 16 MiB, and never less
  # than maxBodySize. Agents gzip their batches, so the decoded size is what
  # binds: a 1 MiB compressed batch commonly expands past 10 MiB.
  maxDecodedBytes: null

  # Optional httpz tuning (null = built-in defaults). workerCount is event-loop
  # workers (default 1) and is clamped to maxConnections. threadPoolCount is
  # request-handler threads per worker (default 128, raised from 32 in v1.30.2);
  # pipeline scratch is allocated on demand, so this bounds retained workspaces,
  # not a startup floor. It is the dominant memory term — see maxConnections.
  workerCount: null
  threadPoolCount: null

  # Service identity sent to the control plane on policy sync. name, namespace,
  # and version scope/match policies to this service; set them in production.
  # resourceAttributes and labels are optional extra metadata. Empty fields are
  # omitted (the binary falls back to its defaults).
  service:
    name: ""
    namespace: ""
    version: ""
    # resourceAttributes:
    #   - key: deployment.environment
    #     value: production
    resourceAttributes: []
    # labels:
    #   - key: team
    #     value: platform
    labels: []

  fileProvider:
    enabled: true
    id: file
    path: /etc/tero/policies.json

  # Optional additional providers appended to policy_providers as raw JSON objects.
  extraPolicyProviders: []

# Rendered into /etc/tero/policies.json for the file provider.
# Each list item must be a valid JSON object string (not YAML object).
policiesJSON: []
# Example:
# policiesJSON:
#   - |
#     {
#       "id": "drop-debug-logs",
#       "name": "drop-debug-logs",
#       "enabled": true,
#       "log": {
#         "match": [{ "log_field": "severity_text", "regex": "DEBUG" }],
#         "keep": "none"
#       }
#     }
