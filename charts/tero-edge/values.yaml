nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/usetero/edge
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Set a tag ("1.29.4") or a digest ("@sha256:...").
  tag: ""
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    # Covers the default maxConnections of 256 held at once (229 MiB measured).
    # Size this from your peak edge_connections_active, not from the cap.
    memory: 256Mi
  limits:
    cpu: 200m
    # Headroom above the 256-connection figure. A policy route also holds a
    # maxBodySize body buffer and a streaming pump per runtime thread, which
    # the per-connection formula under proxy.maxConnections does not count.
    memory: 768Mi

nodeSelector: {}
tolerations:
  - operator: Exists
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

service:
  enabled: false
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false

daemonset:
  updateStrategy:
    type: RollingUpdate

container:
  port: 8080
  hostPort:
    enabled: true
    port: 8080
  args:
    - /etc/tero/config.json
  livenessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5

tero:
  # Control plane base URL used to build the HTTP policy provider endpoint.
  # Example: https://control-plane.example.com
  url: ""
  # Provide inline API key (chart will create a secret) OR use existingSecret below.
  apiKey: ""
  existingSecret:
    name: ""
    key: api-key

config:
  listenAddress: "0.0.0.0"
  listenPort: 8080
  upstreamUrl: "https://agent-http-intake.logs.datadoghq.com"
  metricsUrl: "https://api.datadoghq.com"
  logLevel: "info"
  # Raw (compressed) body cap as received on the wire.
  maxBodySize: 1572864

  # Max concurrent connections, and the concurrency dial on the shipped
  # frontend. Past this cap a new connection is answered 503 with a
  # Retry-After header, logged as connection.shed, and counted by
  # edge_connections_shed_total{reason}. Senders back off and retry rather
  # than time out, but a cap held for longer than a sender can buffer still
  # costs you data. Alert on
  # edge_connections_active / edge_connections_max > 0.8 for lead time.
  #
  # Sizing follows peak concurrency, not request rate, body size or thread
  # count. Each connection gets its own task:
  #
  #   memory ~= 8 MiB + 0.9 MiB x peak concurrent connections
  #
  # Measured: 21 MiB at 16 live connections, 65 MiB at 64, 229 MiB at 256.
  # A sender holds its connection open between batches, so one agent at 10
  # requests/sec and one at 1000 cost the same slot.
  #
  #   peak live connections | approx memory | suggested limit
  #   ----------------------|---------------|----------------
  #   16                    | 21 MiB        | 64Mi
  #   64                    | 65 MiB        | 128Mi
  #   256                   | 229 MiB       | 384Mi
  #   512                   | ~470 MiB      | 768Mi
  #
  # The cap itself is nearly free: a slot reserves 64 KiB of address space
  # and commits a page only when a sender lands on it. Set maxConnections to
  # about four times the peak you see on edge_connections_active, and size
  # memory from that peak rather than from the cap.
  #
  # Also settable via the TERO_MAX_CONNECTIONS env override.
  maxConnections: 256

  # Optional. Post-decompression body ceiling; null uses 16 MiB, and never less
  # than maxBodySize. Agents gzip their batches, so the decoded size is what
  # binds: a 1 MiB compressed batch commonly expands past 10 MiB.
  maxDecodedBytes: null

  # httpz-only tuning, and the shipped image does not run httpz. The default
  # frontend gives each connection its own task and reads neither value, so
  # both are inert here; maxConnections is the concurrency dial. They are kept
  # for anyone who builds with -Dfrontend=httpz, where workerCount is
  # event-loop workers (default 1, clamped to maxConnections) and
  # threadPoolCount is handler threads per worker (default 128).
  workerCount: null
  threadPoolCount: null

  # Service identity sent to the control plane on policy sync. name, namespace,
  # and version scope/match policies to this service; set them in production.
  # resourceAttributes and labels are optional extra metadata. Empty fields are
  # omitted (the binary falls back to its defaults).
  service:
    name: ""
    namespace: ""
    version: ""
    # resourceAttributes:
    #   - key: deployment.environment
    #     value: production
    resourceAttributes: []
    # labels:
    #   - key: team
    #     value: platform
    labels: []

  fileProvider:
    enabled: true
    id: file
    path: /etc/tero/policies.json

  # Optional additional providers appended to policy_providers as raw JSON objects.
  extraPolicyProviders: []

# Rendered into /etc/tero/policies.json for the file provider.
# Each list item must be a valid JSON object string (not YAML object).
policiesJSON: []
# Example:
# policiesJSON:
#   - |
#     {
#       "id": "drop-debug-logs",
#       "name": "drop-debug-logs",
#       "enabled": true,
#       "log": {
#         "match": [{ "log_field": "severity_text", "regex": "DEBUG" }],
#         "keep": "none"
#       }
#     }
