nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/usetero/edge
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion. Set a tag ("1.29.4") or a digest ("@sha256:...").
  tag: ""
imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  requests:
    cpu: 50m
    # Covers the default maxConnections of 256 held at once with policies
    # loaded. Size from your sender count, not from the cap.
    memory: 256Mi
  limits:
    cpu: 200m
    # Headroom over the measured peak at 256 senders (447 MB with 1 MB
    # batches and policies loaded). See the table under proxy.maxConnections.
    memory: 768Mi

nodeSelector: {}
tolerations:
  - operator: Exists
affinity: {}

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

service:
  enabled: false
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

autoscaling:
  enabled: false

daemonset:
  updateStrategy:
    type: RollingUpdate

container:
  port: 8080
  hostPort:
    enabled: true
    port: 8080
  args:
    - /etc/tero/config.json
  livenessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /_health
      port: 8080
    initialDelaySeconds: 2
    periodSeconds: 5

tero:
  # Control plane base URL used to build the HTTP policy provider endpoint.
  # Example: https://control-plane.example.com
  url: ""
  # Provide inline API key (chart will create a secret) OR use existingSecret below.
  apiKey: ""
  existingSecret:
    name: ""
    key: api-key

config:
  listenAddress: "0.0.0.0"
  listenPort: 8080
  upstreamUrl: "https://agent-http-intake.logs.datadoghq.com"
  metricsUrl: "https://api.datadoghq.com"
  logLevel: "info"
  # Raw (compressed) body cap as received on the wire.
  maxBodySize: 1572864

  # Max concurrent connections, and the concurrency dial on the shipped
  # frontend. Past this cap a new connection is answered 503 with a
  # Retry-After header, logged as connection.shed, and counted by
  # edge_connections_shed_total{reason}. Senders back off and retry rather
  # than time out. Alert on
  # edge_connections_active / edge_connections_max > 0.8 for lead time.
  #
  # Memory follows live connections, not this cap: a slot reserves 64 KiB and
  # commits a page only when a sender lands on it. Measured peak RSS with
  # policies loaded:
  #
  #   payload    64 senders   256 senders
  #   ~1 KB          79 MB        179 MB
  #   ~100 KB        88 MB        216 MB
  #   ~1 MB         167 MB        447 MB
  #
  # Set this to about four times your sender count and size memory from the
  # sender count. Also settable via the TERO_MAX_CONNECTIONS env override.
  maxConnections: 256

  # Optional. Post-decompression body ceiling; null uses 16 MiB, and never less
  # than maxBodySize. Agents gzip their batches, so the decoded size is what
  # binds: a 1 MiB compressed batch commonly expands past 10 MiB.
  maxDecodedBytes: null

  # httpz-only tuning, and the shipped image does not run httpz. The default
  # frontend gives each connection its own task and reads neither value, so
  # both are inert; maxConnections is the concurrency dial. Kept for anyone
  # building with -Dfrontend=httpz.
  workerCount: null
  threadPoolCount: null

  # Service identity sent to the control plane on policy sync. name, namespace,
  # and version scope/match policies to this service; set them in production.
  # resourceAttributes and labels are optional extra metadata. Empty fields are
  # omitted (the binary falls back to its defaults).
  service:
    name: ""
    namespace: ""
    version: ""
    # resourceAttributes:
    #   - key: deployment.environment
    #     value: production
    resourceAttributes: []
    # labels:
    #   - key: team
    #     value: platform
    labels: []

  fileProvider:
    enabled: true
    id: file
    path: /etc/tero/policies.json

  # Optional additional providers appended to policy_providers as raw JSON objects.
  extraPolicyProviders: []

# Rendered into /etc/tero/policies.json for the file provider.
# Each list item must be a valid JSON object string (not YAML object).
policiesJSON: []
# Example:
# policiesJSON:
#   - |
#     {
#       "id": "drop-debug-logs",
#       "name": "drop-debug-logs",
#       "enabled": true,
#       "log": {
#         "match": [{ "log_field": "severity_text", "regex": "DEBUG" }],
#         "keep": "none"
#       }
#     }
