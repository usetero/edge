---
# Unit tests
#
# Why this exists:
# No other workflow runs the test suite, so a change could merge without it.
# The suite runs in ReleaseSafe, the mode of the release binaries, so safety
# checks stay on. It runs on both architectures: some memory bugs fault on
# only one of them (a zimdjson read past its token index faulted on x86 only).
#
# The steps match the Linux build in release.yaml.
name: Test
"on":
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          # hyperscan is x86-only, vectorscan is the ARM-compatible fork
          if [ "$(uname -m)" = "x86_64" ]; then
            sudo apt-get install -y libhyperscan-dev
          else
            sudo apt-get install -y libvectorscan-dev
          fi
          sudo apt-get install -y libzstd-dev zlib1g-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Fetch Zig dependencies
        run: |
          for i in 1 2 3 4 5; do zig build --fetch && break || sleep 10; done

      - name: Test
        run: zig build test -Dcpu=baseline -Doptimize=ReleaseSafe --summary all
