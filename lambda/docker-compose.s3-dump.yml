# Overlay for a local end-to-end s3-dump test against RustFS.
#
#   docker compose -f docker-compose.yml -f docker-compose.s3-dump.yml up -d
#   ./s3-dump-test.sh            # invoke a few times + list the bucket
#
# Adds a RustFS S3 target + a one-shot bucket creator, and reconfigures
# lambda-test with the dump-all policy (s3-dump extension) pointing at RustFS.
services:
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9002:9000" # host access for listing/inspection

  # Waits for RustFS, then creates the dump bucket. Runs once and exits.
  # A rerun gets 409 (bucket exists), which also counts as ready.
  createbuckets:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until curl -fsS -o /dev/null http://rustfs:9000/health/ready; do echo 'waiting for rustfs'; sleep 1; done &&
      code=$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT --aws-sigv4 aws:amz:us-east-1:s3 --user rustfsadmin:rustfsadmin http://rustfs:9000/tero-edge-dump) &&
      case $$code in 200|409) echo 'bucket tero-edge-dump ready' ;; *) echo \"bucket create failed: $$code\"; exit 1 ;; esac
      "

  lambda-test:
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    environment:
      # Forwarding target is irrelevant to the dump; keep it pointed anywhere.
      AWS_LAMBDA_FUNCTION_HANDLER: handler.handler
      TERO_LISTEN_PORT: "3000"
      TERO_LOG_LEVEL: debug
      # --- s3-dump: enable + RustFS target (path-style, no TLS) ---
      TERO_S3_DUMP_ENABLED: "true"
      # Small batch age so the non-force invoke-boundary flush seals promptly and
      # you see objects within a couple invokes (default 30s; prod can stay high).
      TERO_S3_DUMP_MAX_BATCH_AGE_MS: "2000"
      TERO_S3_DUMP_TARGETS_JSON: '[{"name":"datadog-forwarder-dump","bucket":"tero-edge-dump","region":"us-east-1","endpoint":"http://rustfs:9000","force_path_style":true,"prefix":"dump/"}]'
      # RustFS creds via the TERO_S3_* set (the reserved AWS_* names are off-limits).
      TERO_S3_ACCESS_KEY_ID: rustfsadmin
      TERO_S3_SECRET_ACCESS_KEY: rustfsadmin
      # --- dump-all policy carrying the s3-dump extension (needs policy-zig >= v0.6.0) ---
      # NOTE: match uses `exists` on body, NOT regex ".*" — Hyperscan rejects a
      # pattern that can match the empty buffer, which would make the whole
      # policy invalid. `mode:"all"` delivers every record to the extension
      # regardless of match anyway, so `exists` is the right "dump everything".
      TERO_POLICY_STATIC: '{"policies":[{"id":"dump-all","name":"Dump all logs to S3","enabled":true,"log":{"keep":"all","match":[{"log_field":"body","exists":true}]},"extensions":[{"type":"com.usetero/s3-dump","version":"1.0.0","mode":"all","target":{"kind":"s3","name":"datadog-forwarder-dump"}}]}]}'
